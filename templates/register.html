<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant & User Registration</title>
    <style>
        body{
            background-color: #f4f6f9;

        }
        /* General popup form style */
        .form-popup {
            display: none;
            position: fixed;
            transform: translate(-50%, -50%);
            background-color: white;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            max-height: 500px;
            border-radius: 10px;
            top: 50%;
            left: 50%;
            padding: 25px 75px 50px 75px;
            flex-direction: column;
            align-items: flex-start;
            flex-shrink: 0;
            background: #FFF;
        }
        .form-popup2 {
            display: none;
            position: fixed;
            transform: translate(-50%, -50%);
            background-color: white;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            height: 600px;
            border-radius: 10px;
            top: 50%;
            left: 50%;
            padding: 25px 75px 50.209px 75px;
            background: #FFF;
        }

        /* Style the images in the popup */
        .form-popup img {
            width: 100%;
            height: auto;
        }
        /* Style the images in the popup */
        .form-popup2 img {
            width: 100%;
            height: auto;
        }

        /* Style the buttons inside the form */
        .form-container .btn {
            background-color: #025252;
            color: #E98758;
            padding: 15px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            opacity: 0.9;
            align-items: center;
            display: justify;
            border-radius: 40px;
            margin-bottom: -10px;
            font-family: "Istok Web";
            font-size: 120%;
        }

        .form-container .btn:hover {
            opacity: 1;
        }

        /* Style the cancel button */
        .form-container .cancel {
            background-color: #E98758;
            color:#025252;
            padding: 15px;
            align-items: center;
            display: justify;
            border-radius: 40px;
            font-family: "Istok Web";
        }

        /* Register button style */
        .register {
            background-color: #E98758;
            color:#025252;
            padding: 10px;
            align-items: center;
            display: justify;
            border-radius: 15px;
            font-family: "Istok Web";
            font-size: 100%;
            opacity: 0.9;
        }

        .register:hover {
            opacity: 1;
            background-color: #E98758;
            
        }
        label {
        font-family: "Istok Web";
        font-size: 16px;
        color: #333;
        display: block;
        margin: 5px 0 2px;
        }


        /* Style for the mini popup */
        #openingTimesForm {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #openingTimesForm h1 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #333;
        }

        #openingTimesForm .day {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        #openingTimesForm .day label {
            flex: 1;
            color: #333;
        }

        #openingTimesForm input[type="time"] {
            flex: 1;
            margin-left: 10px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #openingTimesForm .btn {
            width: 100%;
            margin-top: 20px;
            background-color: #025252;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        #openingTimesForm .btn:hover {
            background-color: #017171;
        }
        .btn-small {
            background-color: #025252; /* Optional: Change background color */
            color: #fff; /* Text color */
            padding: 5px 10px; /* Smaller padding */
            font-size: 14px; /* Smaller font size */
            border-radius: 5px; /* Smaller border radius */
            width: auto; /* Ensure the button doesn't span the full width */
            margin: 10px 0; /* Adjust margin if needed */
        }

        /* Optional: Add hover effect for the small button */
        .btn-small:hover {
            background-color: #017171;
        }

        
    </style>
</head>
<body>
    <!-- Button to open the user registration form -->
    <button class="btn register" onclick="openForm('userForm')"><b>Kunden registrieren</b></button>

    <!-- Button to open the restaurant registration form -->
    <button class="btn register" onclick="openForm('restaurantForm')"><b>Restaurant registrieren</b></button>

    <!-- User Registration Form -->
    <div class="form-popup" id="userForm">
        <img alt="logo" src="{{ url_for('static', filename='images/LP.png') }} ">
        <form action="{{ url_for('registerKunde') }}" class="form-container" method="POST">
            <h1>Benutzer registrieren</h1>
            <label for="vorname"><b>Vorname</b></label>
            <input type="text" placeholder="Vorname" name="vorname" required>

            <label for="nachname"><b>Nachname</b></label>
            <input type="text" placeholder="Nachname" name="nachname" required>

            <label for="adresse"><b>Adresse</b></label>
            <input type="text" placeholder="Adresse" name="adresse" required>

            <label for="postleitzahl"><b>Postleitzahl</b></label>
            <input type="number" placeholder="Postleitzahl" name="postleitzahl" required>

            <label for="password"><b>Passwort</b></label>
            <input type="password" placeholder="Passwort" name="password" required>

            <button type="submit" class="btn"><b>registrieren</b></button>
            <button type="button" class="btn cancel" onclick="closeForm('userForm')"><b>schließen</b></button>
        </form>
    </div>

    <!-- Restaurant Registration Form -->
    <div class="form-popup2" id="restaurantForm" style="max-height: 300px; overflow-y: auto; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        <img src="{{ url_for('static', filename='images/LP.png') }}" alt="Restaurant Icon">
        <form enctype="multipart/form-data" action="{{ url_for('registerResto') }}" class="form-container" method="POST">
            <h1>Restaurant registrieren</h1>
            <label for="name"><b>Name</b></label>
            <input type="text" placeholder="Restaurant Name" name="name" required>

            <label for="strasse"><b>Strasse</b></label>
            <input type="text" placeholder="Strasse" name="strasse" required>

            <label for="plz"><b>Postleitzahl</b></label>
            <input type="number" placeholder="Postleitzahl" name="plz" required>

            <label for="Beschreibung"><b>Beschreibung</b></label>
            <input type="text" placeholder="Beschreibung" name="beschreibung" required>

            <label for="password"><b>Passwort</b></label>
            <input type="password" placeholder="Passwort" name="password" required>              

            <label for="lieferplz"><b>Lieferbare Postleitzahlen</b></label>
            <input type="text" placeholder="12345, 67890, 11111" name="lieferplz" required>

            
            


            <div >
                <div class="day">
                    <label for="monday"><b>Montag</b></label>
                    <input type="time" name="monday-start" required>
                    <input type="time" name="monday-end" required>
                </div>
                <div class="day">
                    <label for="tuesday"><b>Dienstag</b></label>
                    <input type="time" name="tuesday-start" required>
                    <input type="time" name="tuesday-end" required>
                </div>
                <div class="day">
                    <label for="wednesday"><b>Mittwoch</b></label>
                    <input type="time" name="wednesday-start" required>
                    <input type="time" name="wednesday-end" required>
                </div>
                <div class="day">
                    <label for="thursday"><b>Donnerstag</b></label>
                    <input type="time" name="thursday-start" required>
                    <input type="time" name="thursday-end" required>
                </div>
                <div class="day">
                    <label for="friday"><b>Freitag</b></label>
                    <input type="time" name="friday-start" required>
                    <input type="time" name="friday-end" required>
                </div>
                <div class="day">
                    <label for="saturday"><b>Samstag</b></label>
                    <input type="time" name="saturday-start" required>
                    <input type="time" name="saturday-end" required>
                </div>
                <div class="day">
                    <label for="sunday"><b>Sonntag</b></label>
                    <input type="time" name="sunday-start" required>
                    <input type="time" name="sunday-end" required>
                </div>
                <input type="file" name="file" accept="image/*">Image</input>
            </div>
            

            <button type="submit" class="btn" onclick="sendData()"><b>registrieren</b></button>
            <button type="button" class="btn cancel" onclick="closeForm('restaurantForm')"><b>schließen</b></button>
        </form>
    </div>


    

    <script src=" {{url_for('static', filename= 'login_popup.js')}}">
        
    </script>

</body>
</html>
