<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lieferspatz-restaurantLogin</title>
    <link rel="icon" type="image/x-icon" href="images/Lieferspatz.svg">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<!-- Headerbar -->
<header>
    <div>
        <p>
        <a href="/">
        <img style="width:50px;height:50px;" src="{{ url_for('static', filename='images/Lieferspatz.svg') }}" alt="Logo">
        </a>
        <a href="/">
        <img src="{{ url_for('static', filename='images/LieferspatzSchrift.svg') }}" style="width:300px;height:50px;">
        </a></p>
        <hr>
    </div>
</header>

<!-- Speisekarte -->

<h1 class="head">Speisekarte</h1>
<h3 id="C1" class="head">Menü</h3>

{% for x in items %}
<div class="card">
    <img src="{{ url_for('static', filename='images/burgermenu.jpg')}}" style="width:100%">
    <div class="container">
        <h4 id="itmhead_{{loop.index}}">{{x.itmname}}</h4>
        <p id="itmdesc_{{loop.index}}">{{x.description}}</p>
        <p id="itmprice_{{loop.index}}"><b>{{x.price}}</b></p>
        <button class="plusbtn" type="button" onclick=increaseAmount({{loop.index}})>+</button>
        <button class="minusbtn" type="button" onclick=decreaseAmount({{loop.index}})>-</button>
        <p>Amount:</p><p id="itmamount_{{loop.index}}">0</p>
        <button class="minusbtn" type="button" onclick=addToCart({{loop.index}})>add to cart</button>
    </div>
</div>
{% endfor %}

<!-- Place Order -->
<div>
    <button class="minusbtn" type="button" onclick=place_Order()>place order</button>
</div>

<p id="test_cart">test results</p>

<script>
    const current_cart = [];

    function addToCart(cycle){
        let cart_item = {itemname: document.getElementById("itmhead_".concat(cycle.toString())).innerHTML, description: document.getElementById("itmdesc_".concat(cycle.toString())).innerHTML, price: document.getElementById("itmprice_".concat(cycle.toString())).innerHTML, amount: document.getElementById("itmamount_".concat(cycle.toString())).innerHTML};
        current_cart.push(Object.values(cart_item));
    }

    function place_Order(){
        document.getElementById("test_cart").innerHTML = current_cart.toString();
    }

    function increaseAmount(amount){
        const y = document.getElementById("itmamount_".concat(amount.toString()));
        let num = parseInt(y.innerHTML);
        num += 1;
        y.innerHTML = num;
    }

    function decreaseAmount(amount){
        const y = document.getElementById("itmamount_".concat(amount.toString()));
        let num = parseInt(y.innerHTML);
        if (num > 0){
            num -= 1;
            y.innerHTML = num;
        }
    }
</script>


<!-- footer -->
<footer>

</footer>

</body>
</html>
